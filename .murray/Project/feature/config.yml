name: feature
parameters:
- name: name
  isRequired: true
  description: "The name of the feature"
- name: appName
  isRequired: true
  description: "The target app to register this feature into"
paths:
- from: Module
  to: Sources/Features/{{name|firstUppercase}}
description: An empty feature module. 
plugins:
  shell:
    after:  
    - "cd Sources/Features/{{name|firstUppercase}}/ && mise exec -- sourcery --config sourcery.yml"
replacements: 
- text: |
        await features.append(AppSettings.Feature(self))
  placeholder: "// murray: registration"
  destination: "Sources/Apps/{{appName|firstUppercase}}/Sources/Container/AppContainer.swift"
- text: |
        import {{name|firstUppercase}}
  placeholder: "// murray: import"
  destination: "Sources/Apps/{{appName|firstUppercase}}/Sources/Container/AppContainer.swift"
- text: |
        .{{name|firstLowercase}}(),
  destination: "{{tuist.config.app}}"
  placeholder: "// murray: feature integration"
- text: |
        .{{name|firstLowercase}}(),
  destination: "{{tuist.workspace.config}}"
  placeholder: "// murray: feature integration"
- text: |
        static func {{name|firstLowercase}}() -> Self {
          .init(name: "{{name|firstUppercase}}",
                       destinations: Constants.destinations,
                       deploymentTargets: .custom,
                       dependencies: .init(core: [.routes(), .networking(), .components()],
                                                   deviceCapabilities: [],
                                                   external: []),
                      testDependencies: .init(test: [.coreTesting()]),
                       synthesizers: [])
        }
  destination: "{{tuist.config.feature}}"
  placeholder: "// murray: declaration"
plugins:
    shell: 
      after: []
